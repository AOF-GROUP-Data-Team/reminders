name: Water Filter Reminder

# Triggered by the "github alarm" Apps Script every day at 09:00 KSA.
# The script itself only sends on the 1st of the month (KSA time).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = send only if today is the 1st (KSA) | force = send now (testing)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - force

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send reminder email
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python send_reminder.py
